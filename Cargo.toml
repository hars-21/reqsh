[package]
name = "reqsh"
version = "0.3.1"
edition = "2024"
rust-version = "1.93"

license = "MIT"
authors = ["Harshil Gupta"]
description = "Interactive HTTP shell for API workflows"
homepage = "https://reqsh.dev"
repository = "https://github.com/hars-21/reqsh"
documentation = "https://docs.rs/reqsh"

keywords = ["http", "repl", "cli", "api", "terminal"]
categories = ["command-line-utilities", "web-programming::http-client"]

readme = "README.md"

[dependencies]
colored = "3.1.1"
dirs = "6.0.0"
json-color = "0.7.1"
reedline = "0.49.0"
reqwest = { version = "0.13.2", features = ["blocking", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
